name: CI

# feat-* / fix-* 也触发：功能验证的唯一载体就是这条流水线，
# 等合到 develop 才跑的话，分支上的活等于一路没有信号。
on:
  push:
    branches: [master, develop, 'feat-*', 'fix-*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 必须用 gofmt -l（只列不改）。旧的 test.yml 用的是 go fmt ./...，
      # 它会就地改写文件并始终退出 0 —— 是个永远通过的假检查。
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w ./..."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 带 build tag 的四组不在 go vet ./... 的视野里，而它们各自的载体是
      # integration.yml（分钟级）与 e2e.yml（每晚）。不在这里编一遍的话，
      # test/cluster 写错一个字，最坏要到第二天早上才知道。
      - name: go vet（带 build tag 的测试组）
        run: |
          go vet -tags=remote ./test/remote/...
          go vet -tags=multinode ./test/multinode/...
          go vet -tags=cluster ./test/cluster/...
          go vet -tags=swarm ./test/swarm/...

      - name: yamllint configs
        run: pipx install yamllint && yamllint -d relaxed configs/

      # configs/k8s 里的清单渲染时开着 missingkey=error：用了一个 cluster create
      # 不注入的 {{.Vars.xxx}}，整条命令会在节点上报 "map has no entry for key"，
      # 而那要等每晚的 e2e 才看得到。这里当场把两边对上。
      # 只查 *.yaml：同目录的 README 也写着这些变量名，那是文档不是模板。
      - name: configs/k8s 用到的模板变量必须有人注入
        run: |
          missing=0
          for var in $(grep -rho '{{\.Vars\.[A-Za-z0-9_]*}}' configs/k8s/*.yaml \
              | sed 's/{{\.Vars\.//; s/}}//' | sort -u); do
            if ! grep -q "\"$var\":" pkg/cluster/catalog.go; then
              echo "configs/k8s 用了 {{.Vars.$var}}，但 setK8sTemplateVars 没有注入它"
              missing=1
            fi
          done
          exit $missing

      # 集群编排只负责编排：装什么下沉到 configs/k8s/*.yaml 之后，
      # pkg/cluster 里不该再出现资源定义。留一条就是留一处改了配置不生效的地方。
      - name: pkg/cluster 内不得有 Resource 字面量
        run: |
          if grep -rn 'types\.Resource{' pkg/cluster/*.go; then
            echo "pkg/cluster 里出现了资源定义：安装内容应写在 configs/k8s/*.yaml"
            exit 1
          fi

      # 功能验证一律黑盒：test/ 下只允许用 os/exec 跑编译出来的二进制。
      # 一旦有用例 import 本仓库的包，断言的就是内部实现而不是工具行为。
      # 匹配带前引号的形式 —— import 路径一定带引号，注释里提到包名不算违规。
      # 原先裸匹配包名，连"这里不 import 本仓库包"这句注释都会判违规，是个恒红的检查。
      - name: test 不得 import 本仓库包
        run: |
          if grep -rn '"github.com/structure-projects/somcli' test/; then
            echo "test/ 下禁止 import 本仓库包：功能验证一律通过二进制黑盒进行"
            exit 1
          fi

  test:
    name: 功能验证 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 默认只跑 local 组（remote / multinode 由 build tag 隔离，见 integration.yml）。
      # 三种操作机同时跑是 SC-P08 / SC-P09 的载体。
      # 不设覆盖率门槛：覆盖率是白盒指标，进度以 test/matrix.yaml 的场景数衡量。
      - name: 测试
        run: go test ./... -count=1 -race

  build:
    name: 交叉编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # SC-P10：4 平台交叉编译产物可用（linux/darwin × amd64/arm64，不含 windows）。
      # 编到真实文件而非 /dev/null，这样能顺带断言产物非空；
      # 与宿主同架构的那一组再跑一次 version，证明产物真的能执行。
      - name: 编译
        run: |
          out="dist/somcli-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "$out" .
          test -s "$out" || { echo "产物为空: $out"; exit 1; }

      - name: 冒烟执行
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/somcli-linux-amd64 version

  docs:
    name: 文档防漂移（doc/00 + doc/11）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 重新生成 doc/00（命令树+matrix）与 doc/11（cobra 命令参考）。
      # 与仓库里提交的版本比对：任何 diff 都意味着改了命令/标志/场景状态却没重新生成文档。
      - name: 重新生成文档
        run: make docs
      - name: 比对差异
        run: |
          if ! git diff --exit-code -- doc/00-功能清单与矩阵.md doc/11-命令参考.md; then
            echo "::error::生成的文档与提交版本不一致，请在本地运行 make docs 后提交"
            exit 1
          fi
