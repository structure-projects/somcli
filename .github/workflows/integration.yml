# 需要真实 SSH 环境的功能验证。
#
# 这两组用 build tag 隔离（remote / multinode），默认 `go test ./...` 不跑 ——
# 开发机通常没开 sshd、也不一定有 docker。所以它们的载体只有这条流水线，
# 一旦这里不跑，test/remote 与 test/multinode 就等于不存在。
#
# 两组都在 CI 里硬失败而非跳过：GitHub 自动设了 CI=true，用例据此判定
# "连不上不是环境不具备，而是下面的准备步骤坏了"，不让"跳过"冒充"通过"。
name: Integration

on:
  push:
    branches: [master, develop, 'feat-*', 'fix-*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote:
    name: 远程执行与分发 (SC-E03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 目标地址用 127.0.0.2 而不是 127.0.0.1：somcli 把 host/ip 为 localhost 或
      # 127.0.0.1 的节点当本机直接 sh -c 执行，只有回环别名能逼它真的走 ssh。
      # Linux 上 127.0.0.0/8 整段都在 lo 上，sshd 监听 0.0.0.0 就能连，无需额外配地址。
      - name: 准备 sshd 与免密登录
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo systemctl enable --now ssh

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_rsa -C somcli-integration
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      # 先自检一次。准备步骤坏了就在这里报出来，而不是让一堆用例各自失败一遍。
      - name: 自检 SSH 可达
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$(id -un)@127.0.0.2" 'echo SSH_CONNECTION=$SSH_CONNECTION'

      - name: 测试
        run: go test -tags=remote ./test/remote/... -count=1 -v -timeout 15m

  multinode:
    name: 多节点编排 (SC-E04/E05/E06/E14/E15/E16/F05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 自检 docker 可用
        run: docker info --format '{{.ServerVersion}}' && docker compose version

      # 容器由 test/multinode 的 TestMain 起停（fixture 见 test/fixtures/multinode）。
      # KEEP=1 让失败后容器还在，下一步才能把节点日志捞出来 —— runner 是一次性的，
      # 留着不影响别人。
      - name: 测试
        env:
          SOMCLI_MULTINODE_KEEP: '1'
        run: go test -tags=multinode ./test/multinode/... -count=1 -v -timeout 25m

      - name: 失败时收集节点日志
        if: failure()
        run: docker compose -f test/fixtures/multinode/compose.yaml logs --no-color

      - name: 清理容器
        if: always()
        run: docker compose -f test/fixtures/multinode/compose.yaml down -v --remove-orphans

  distros:
    name: 真实发行版装包 (SC-M02, ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'ubuntu:24.04'      # apt-get
          - 'debian:12'         # apt-get
          - 'fedora:41'         # dnf
          - 'alpine:3.20'       # apk
          - 'opensuse/leap:15.6' # zypper
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        # alpine 没有 bash，五个镜像统一用 sh 才不用为其中一个开特例。
        shell: sh
    steps:
      # 各发行版的最小镜像连 tar / git 都不一定有，actions/checkout 与后面装 Go
      # 都依赖它们，所以先手动补齐。
      # alpine 还要额外补 libc6-compat：actions/* 动作跑在 runner 自带的 node 上，
      # 那个 node 是 glibc 动态链接的，musl 系统上直接起不来。
      - name: 补齐前置依赖
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl tar gzip git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y --allowerasing ca-certificates curl tar gzip git
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache ca-certificates curl tar gzip git libc6-compat libstdc++
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install ca-certificates curl tar gzip git
          else
            echo "镜像 ${{ matrix.image }} 里认不出包管理器"; exit 1
          fi

      - uses: actions/checkout@v4

      # 不用 actions/setup-go：它落下来的工具链在 alpine（musl）上跑不起来。
      # 直接取官方 tarball，五个镜像同一条路径。
      - name: 装 Go
        run: |
          set -eux
          curl -fsSL https://go.dev/dl/go1.24.0.linux-amd64.tar.gz -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      # SC-M02 的另一半：不是"命令发对了"，而是**真的把包装上了**。
      # 判据是装完 jq 能跑起来并吐出版本号 —— 只看 somcli 退出码 0 的话，
      # 包管理器静默失败（E1 的病症）照样绿。
      # 前置先确认镜像里没自带 jq，否则这条什么都没验。
      # 容器里是 root，所以不涉及 --sudo；--sudo 的行为由 test/local 覆盖。
      - name: 用 method:package 真装 jq
        run: |
          set -eux
          if command -v jq >/dev/null 2>&1; then
            echo "镜像里已自带 jq，这条验不出东西"
            exit 1
          fi

          go build -o /tmp/somcli .
          cat > /tmp/jq.yaml <<'YAML'
          resources:
            - name: jq
              version: "system"
              method: "package"
          YAML
          /tmp/somcli --workdir /tmp/somwork install -f /tmp/jq.yaml

          jq --version
