# 需要真实 SSH 环境的功能验证。
#
# 这两组用 build tag 隔离（remote / multinode），默认 `go test ./...` 不跑 ——
# 开发机通常没开 sshd、也不一定有 docker。所以它们的载体只有这条流水线，
# 一旦这里不跑，test/remote 与 test/multinode 就等于不存在。
#
# 两组都在 CI 里硬失败而非跳过：GitHub 自动设了 CI=true，用例据此判定
# "连不上不是环境不具备，而是下面的准备步骤坏了"，不让"跳过"冒充"通过"。
name: Integration

on:
  push:
    branches: [master, develop, 'feat-*', 'fix-*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote:
    name: 远程执行与分发 (SC-E03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 目标地址用 127.0.0.2 而不是 127.0.0.1：somcli 把 host/ip 为 localhost 或
      # 127.0.0.1 的节点当本机直接 sh -c 执行，只有回环别名能逼它真的走 ssh。
      # Linux 上 127.0.0.0/8 整段都在 lo 上，sshd 监听 0.0.0.0 就能连，无需额外配地址。
      - name: 准备 sshd 与免密登录
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo systemctl enable --now ssh

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_rsa -C somcli-integration
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      # 先自检一次。准备步骤坏了就在这里报出来，而不是让一堆用例各自失败一遍。
      - name: 自检 SSH 可达
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$(id -un)@127.0.0.2" 'echo SSH_CONNECTION=$SSH_CONNECTION'

      - name: 测试
        run: go test -tags=remote ./test/remote/... -count=1 -v -timeout 15m

  multinode:
    name: 多节点编排 (SC-E04/E05/E06/E14/E15/E16/F05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 自检 docker 可用
        run: docker info --format '{{.ServerVersion}}' && docker compose version

      # 容器由 test/multinode 的 TestMain 起停（fixture 见 test/fixtures/multinode）。
      # KEEP=1 让失败后容器还在，下一步才能把节点日志捞出来 —— runner 是一次性的，
      # 留着不影响别人。
      - name: 测试
        env:
          SOMCLI_MULTINODE_KEEP: '1'
        run: go test -tags=multinode ./test/multinode/... -count=1 -v -timeout 25m

      - name: 失败时收集节点日志
        if: failure()
        run: docker compose -f test/fixtures/multinode/compose.yaml logs --no-color

      - name: 清理容器
        if: always()
        run: docker compose -f test/fixtures/multinode/compose.yaml down -v --remove-orphans

  distros:
    name: 发行版包管理器 (SC-M02 / SC-P01..P06, ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 test/matrix.yaml 的 SC-P01..P06 一一对应：五个包管理器各至少一格，
        # RHEL 系分 yum（centos7）与 dnf（rocky9）两格，因为命令模板不同。
        image:
          - 'centos:7'            # P01 yum
          - 'rockylinux:9'        # P02 dnf
          - 'ubuntu:22.04'        # P03 apt
          - 'debian:12'           # P04 apt
          - 'opensuse/leap:15.6'  # P05 zypper
          - 'alpine:3.20'         # P06 apk
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        # alpine 没有 bash，六个镜像统一用 sh 才不用为其中一个开特例。
        shell: sh
    steps:
      # CentOS 7 已 EOL：mirrorlist.centos.org 与 mirror.centos.org 都已下线，
      # 不改源 yum 一步都走不出去。把仓库指到 vault（用 http：这台老镜像的
      # ca-certificates 未必信得过新证书，而 RPM 自带 gpg 签名保完整性）。
      - name: CentOS 7 切换 vault 源
        if: matrix.image == 'centos:7'
        run: |
          set -eux
          sed -i 's|^mirrorlist=|#mirrorlist=|g' /etc/yum.repos.d/CentOS-*.repo
          sed -i 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo
          yum makecache fast

      # 各发行版的最小镜像连 tar / git 都不一定有，actions/checkout 与后面装 Go
      # 都依赖它们，所以先手动补齐。
      # alpine 还要额外补 libc6-compat：actions/* 动作跑在 runner 自带的 node 上，
      # 那个 node 是 glibc 动态链接的，musl 系统上直接起不来。
      - name: 补齐前置依赖
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl tar gzip git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y --allowerasing ca-certificates curl tar gzip git
          elif command -v yum >/dev/null 2>&1; then
            yum install -y ca-certificates curl tar gzip git
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache ca-certificates curl tar gzip git libc6-compat libstdc++
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install ca-certificates curl tar gzip git
          else
            echo "镜像 ${{ matrix.image }} 里认不出包管理器"; exit 1
          fi

      - uses: actions/checkout@v4

      # 不用 actions/setup-go：它落下来的工具链在 alpine（musl）上跑不起来。
      # 直接取官方 tarball，六个镜像同一条路径。
      - name: 装 Go
        run: |
          set -eux
          curl -fsSL https://go.dev/dl/go1.24.0.linux-amd64.tar.gz -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      # 不是"命令发对了"，而是**真的把包装上了**：判据是装完 make 能跑起来并
      # 吐出版本号 —— 只看 somcli 退出码 0 的话，包管理器静默失败（E1 的病症）照样绿。
      # 前置先确认镜像里没自带 make，否则这条什么都没验。
      # 容器里是 root，所以不涉及 --sudo；--sudo 的行为由 test/local 覆盖。
      - name: 用 method:package 装基础依赖
        run: |
          set -eux
          if command -v make >/dev/null 2>&1; then
            echo "镜像里已自带 make，这条验不出东西"
            exit 1
          fi

          go build -o /tmp/somcli .
          /tmp/somcli --workdir /tmp/somwork install -f test/fixtures/base-deps.yaml

          make --version

  # F12 换源端到端：容器里默认是上游官方源，somcli 先切成阿里云镜像再装 make。
  # 本地黑盒（test/local/source_test.go）只验命令编排，sed 规则对不对、镜像站通不通，
  # 必须在真发行版里跑一次才知道。apt 与 dnf 各取一格（ubuntu/rocky），其余包管理器的
  # 分支结构相同，由本地用例覆盖。
  source-aliyun:
    name: 换源 aliyun (SC-X11, ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'ubuntu:22.04'   # apt
          - 'rockylinux:9'   # dnf
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 补齐构建前置依赖
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl tar gzip git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y ca-certificates curl tar gzip git
          fi
      - uses: actions/checkout@v4
      - name: 装 Go
        run: |
          set -eux
          curl -fsSL https://go.dev/dl/go1.24.0.linux-amd64.tar.gz -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      - name: "source: aliyun 后装 make"
        run: |
          set -eux
          if command -v make >/dev/null 2>&1; then
            echo "镜像里已自带 make，这条验不出东西"
            exit 1
          fi
          go build -o /tmp/somcli .
          /tmp/somcli --workdir /tmp/somwork install -f test/fixtures/source-aliyun.yaml
          make --version
