# 多 master 用例（SC-K04）的 apiserver 入口。
#
# 纯四层转发：apiserver 是 TLS 终结方，证书由 kubeadm 签给这个地址
# （--control-plane-endpoint），中间这一跳不能拆包。
#
# 健康检查是必须的：第一台 master 装好、第二台还没加入时，后端只有一个活的，
# 没有检查就有一半连接被丢给空地址，表现是 kubeadm join 间歇性超时。
global
  daemon
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend apiserver
  bind *:6443
  default_backend masters

backend masters
  option tcp-check
  # inter 2s：master 加入后要尽快被认出来，否则 kubeadm 后续几步还在只用一台。
  server m1 172.29.0.11:6443 check inter 2s
  server m2 172.29.0.13:6443 check inter 2s
