# 功能 × 场景覆盖矩阵（人工维护的验收清单）
#
# 这是 doc/提案-架构收敛与测试体系.md §3.2 场景全集的唯一事实来源，
# 也是各阶段提案「完成标准」引用的对象。本文件由人维护、由人评审，
# 不存在校验它自己的元测试 —— 测试只用来验证 somcli 的功能。
#
# 所有用例一律黑盒：编译出 somcli 二进制 → 喂真实配置文件 → 执行真实命令 →
# 断言退出码 / 输出 / 落盘产物 / 目标节点状态。test/ 下禁止 import 本仓库的 pkg/。
#
# 字段：
#   id      场景编号，规则 SC-<域><序号>
#   desc    场景描述
#   env     该场景需要的执行环境（决定 build tag 与在哪条流水线跑）：
#             local     只需 Go + 本机 shell，默认 go test ./... 就跑
#             remote    需要 SSH 可达的单个节点（CI runner 对自身 SSH）
#             multinode 需要 3 个 sshd 容器
#             cluster   需要可安装 k8s 的特权 systemd 容器
#             swarm     需要可安装 docker 的特权 systemd 容器（与 cluster 分开：
#                       装 docker 会覆盖 k8s 用例装出来的 containerd 配置）
#             matrix    由流水线的平台矩阵承载，无 Go 用例
#   files   承载该场景的用例文件（相对仓库根）
#   defects 该场景负责回归的缺陷编号，见提案 §4
#   phase   在哪个阶段兑现，见提案 §5.2
#   status  pending | done

