# runc —— containerd 真正用来起容器的那一层。
resources:
  - name: "runc"
    version: "1.1.14"
    urls:
      - "https://github.com/opencontainers/runc/releases/download/v{{.Version}}/runc.amd64"
    target: "{{.Filename}}"
    post_install:
      - "install -m 755 {{.CacheDir}}/runc.amd64 /usr/local/sbin/runc"
