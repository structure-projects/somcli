# containerd 运行时。
#
# 单元文件自己写而不是用压缩包里带的那份：包里的 containerd.service 指向
# /usr/local/bin/containerd 之外的路径时，systemctl enable 会成功而 start 失败。
resources:
  - name: "containerd"
    version: "1.7.22"
    urls:
      - "https://github.com/containerd/containerd/releases/download/v{{.Version}}/containerd-{{.Version}}-linux-{{.Arch}}.tar.gz"
    target: "{{.Filename}}"
    extra_files:
      /etc/systemd/system/containerd.service: |
        [Unit]
        Description=containerd container runtime
        Documentation=https://containerd.io
        After=network.target local-fs.target

        [Service]
        ExecStartPre=-/sbin/modprobe overlay
        ExecStart=/usr/local/bin/containerd
        Restart=always
        RestartSec=5
        Delegate=yes
        KillMode=process
        OOMScoreAdjust=-999
        LimitNOFILE=1048576
        LimitNPROC=infinity
        LimitCORE=infinity

        [Install]
        WantedBy=multi-user.target
    post_install:
      - "tar Cxzvf /usr/local {{.CacheDir}}/{{.Filename}}"
      - "mkdir -p /etc/containerd"
      - "containerd config default | tee /etc/containerd/config.toml >/dev/null"
      # 镜像仓库相关的两条 sed 只在真的配了仓库时才能跑：无条件跑的话生成的是
      # sed 's|k8s.gcr.io||g' 与 sandbox_image = "/pause:"，配置被改坏，
      # containerd 拉不到 pause 镜像，而报错指向的是"沙箱镜像拉取失败"。
      - |
        if [ -n "{{.Vars.imageRepository}}" ]; then
          sed -i "s|k8s.gcr.io|{{.Vars.imageRepository}}|g" /etc/containerd/config.toml
          if [ -n "{{.Vars.pauseImageVersion}}" ]; then
            sed -i "s|sandbox_image = \".*\"|sandbox_image = \"{{.Vars.imageRepository}}/pause:{{.Vars.pauseImageVersion}}\"|g" /etc/containerd/config.toml
          fi
        fi
      # kubeadm 默认用 systemd 驱动，containerd 默认配置里是 cgroupfs。
      # 两边不一致的表现是 kubelet 反复重启，而报错完全指不到根因上。
      - "sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml"
      # 改完必须验：containerd 换过配置格式（v2/v3 的键位置不同），
      # sed 没匹配上时它照样退 0，那就成了"改过了"的假象。
      - "grep -q 'SystemdCgroup = true' /etc/containerd/config.toml"
      - "systemctl daemon-reload"
      - "systemctl enable --now containerd"
