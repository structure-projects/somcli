# kubeadm preflight 要求的基础环境。
#
# 这一条必须每次都跑（cluster create 对它强制执行，不看幂等状态）：
# swapoff 与 modprobe 的效果重启就没了，而状态库会说"装过了"直接跳过，
# 结果是重启后再装一次集群，kubeadm 在 preflight 阶段被 swap 挡住。
resources:
  - name: "base-dependencies"
    extra_files:
      # 这两个文件是持久化的那一半：只 modprobe / sysctl -w 的话重启即失效，
      # 而重启后的表现是 Pod 网络莫名不通，指不到根因上。
      /etc/modules-load.d/k8s.conf: |
        overlay
        br_netfilter
      /etc/sysctl.d/k8s.conf: |
        net.bridge.bridge-nf-call-iptables  = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward                 = 1
    post_install:
      # 包管理器的判断写在下发的 shell 里而不是 Go 侧：装包发生在目标节点上，
      # 拿操作机的发行版去挑包管理器，一到远程就是错的。
      - |
        if command -v apt-get >/dev/null 2>&1; then
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y socat conntrack ebtables ipset
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y --allowerasing socat conntrack-tools ebtables ipset
        elif command -v yum >/dev/null 2>&1; then
          yum install -y socat conntrack ebtables ipset
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache socat conntrack-tools ebtables ipset
        elif command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive install socat conntrack-tools ebtables ipset
        else
          echo "认不出节点上的包管理器，请先手工安装 socat conntrack ebtables ipset" >&2
          exit 1
        fi
      - "swapoff -a"
      - "sed -i '/ swap / s/^/#/' /etc/fstab"
      - "modprobe overlay"
      - "modprobe br_netfilter"
      - "sysctl --system"
      # 写了文件、跑了 sysctl --system，不等于参数真的生效：模块没加载时这两个键
      # 根本不存在，sysctl --system 只打一行警告然后退 0。当场验一遍，
      # 让它在这里失败，而不是等 kubeadm preflight 报一个指不到根因的错。
      - 'test "$(sysctl -n net.bridge.bridge-nf-call-iptables)" = 1'
      - 'test "$(sysctl -n net.ipv4.ip_forward)" = 1'
