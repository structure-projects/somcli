# Kubernetes 集群安装示例（统一 schema：单文档，nodes + resources）。
#
# 早期版本是 `kind: Download|Resource|App|Node|source` 五个 YAML 文档，外加 flows /
# depends_on / Apps / roles / sources —— 加载器只读第一个文档，其余全部静默失效。
# 那些未实现的声明式设计与逐条改写指引见 doc/roadmap.md。
#
# 这一版只用真实存在的字段：节点在 nodes: 声明，每个资源用 hosts: 点名落到哪些节点，
# 需要的产物走 urls: + target: 下载，落盘文件走 extra_files:。
#
# 用法：somcli install -f configs/kubernetes-cluster.yaml

nodes:
  - host: "k8s-master-01"
    ip: "172.20.10.11"
    role: "master"
    user: "root"
    sshKey: "~/.ssh/id_rsa"
  - host: "k8s-worker-01"
    ip: "172.20.10.23"
    role: "worker"
    user: "root"
    sshKey: "~/.ssh/id_rsa"

resources:
  # 1. 基础依赖：所有节点
  - name: "base-dependencies"
    version: "1.0"
    hosts:
      - "k8s-master-01"
      - "k8s-worker-01"
    post_install:
      - "yum install -y socat conntrack ebtables ipset"
      - "swapoff -a"
      - "sed -i '/ swap / s/^/#/' /etc/fstab"
      - "modprobe overlay"
      - "modprobe br_netfilter"
      - "sysctl --system"

  # 2. containerd 运行时：所有节点
  #    压缩包自带 containerd.service，解开后直接取用，不需要额外写单元文件。
  - name: "containerd"
    version: "1.7.0"
    urls:
      - "https://github.com/containerd/containerd/releases/download/v{{.Version}}/containerd-{{.Version}}-linux-{{.Arch}}.tar.gz"
      - "https://github.com/opencontainers/runc/releases/download/v1.1.9/runc.{{.Arch}}"
      - "https://github.com/containernetworking/plugins/releases/download/v1.2.0/cni-plugins-linux-{{.Arch}}-v1.2.0.tgz"
    target: "{{.Filename}}"
    hosts:
      - "k8s-master-01"
      - "k8s-worker-01"
    post_install:
      - "tar Cxzvf /usr/local {{.CacheDir}}/containerd-{{.Version}}-linux-{{.Arch}}.tar.gz"
      - "install -m 755 {{.CacheDir}}/runc.{{.Arch}} /usr/local/sbin/runc"
      - "mkdir -p /opt/cni/bin"
      - "tar Cxzvf /opt/cni/bin {{.CacheDir}}/cni-plugins-linux-{{.Arch}}-v1.2.0.tgz"
      - "install -m 644 /usr/local/lib/systemd/system/containerd.service /etc/systemd/system/containerd.service"
      - "mkdir -p /etc/containerd"
      - "containerd config default > /etc/containerd/config.toml"
      - "sed -i 's|SystemdCgroup = false|SystemdCgroup = true|g' /etc/containerd/config.toml"
      - "systemctl daemon-reload"
      - "systemctl enable --now containerd"

  # 3. Kubernetes 组件：所有节点
  - name: "kubernetes"
    version: "1.28.2"
    urls:
      - "https://storage.googleapis.com/kubernetes-release/release/v{{.Version}}/bin/linux/{{.Arch}}/kubeadm"
      - "https://storage.googleapis.com/kubernetes-release/release/v{{.Version}}/bin/linux/{{.Arch}}/kubelet"
      - "https://storage.googleapis.com/kubernetes-release/release/v{{.Version}}/bin/linux/{{.Arch}}/kubectl"
      - "https://structured.oss-cn-beijing.aliyuncs.com/somwork/service/kubelet.service"
    target: "{{.Filename}}"
    hosts:
      - "k8s-master-01"
      - "k8s-worker-01"
    post_install:
      - "install -m 755 {{.CacheDir}}/kubeadm /usr/local/bin/kubeadm"
      - "install -m 755 {{.CacheDir}}/kubelet /usr/local/bin/kubelet"
      - "install -m 755 {{.CacheDir}}/kubectl /usr/local/bin/kubectl"
      - "install -m 644 {{.CacheDir}}/kubelet.service /etc/systemd/system/kubelet.service"
      - "systemctl daemon-reload"
      - "systemctl enable --now kubelet"

  # 4. Master 初始化 + 网络插件：只在 master 上跑
  - name: "k8s-master-init"
    version: "1.28.2"
    urls:
      - "https://raw.githubusercontent.com/flannel-io/flannel/v0.22.0/Documentation/kube-flannel.yml"
    target: "{{.Filename}}"
    hosts:
      - "k8s-master-01"
    post_install:
      - "kubeadm init --kubernetes-version v{{.Version}} --pod-network-cidr 10.244.0.0/16 --cri-socket unix:///var/run/containerd/containerd.sock"
      - "mkdir -p $HOME/.kube"
      - "cp -f /etc/kubernetes/admin.conf $HOME/.kube/config"
      - "kubectl apply -f {{.CacheDir}}/kube-flannel.yml"
      - "kubeadm token create --print-join-command > /tmp/join-command"

  # 5. Worker 加入：join 命令由上一步在 master 上生成，需先取回来
  - name: "k8s-worker-join"
    version: "1.28.2"
    hosts:
      - "k8s-worker-01"
    pre_install:
      - "test -s /tmp/join-command"
    post_install:
      - "sh /tmp/join-command"
